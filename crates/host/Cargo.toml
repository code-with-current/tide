[package]
name = "host"
version = "0.1.0"
edition = "2024"
description = "Filesystem, process, Git, and workspace services for Tide"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
git2 = "0.21"
protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
store = { path = "../store" }
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
