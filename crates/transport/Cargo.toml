[package]
name = "transport"
version = "0.1.0"
edition = "2024"
description = "Authenticated WebSocket transport and RPC dispatch for Tide"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
client = { path = "../client" }
