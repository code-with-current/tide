[package]
name = "backend"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Tide"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
parking_lot = "0.12"
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
protocol = { path = "../protocol" }
transport = { path = "../transport" }
host = { path = "../host" }
runtime = { path = "../runtime" }
store = { path = "../store" }

[dev-dependencies]
base64 = "0.22"
client = { path = "../client" }
tempfile = "3"
