[package]
name = "engine"
# Vendored from tide (upstream: src-tauri/crates/tide-engine, locally renamed). De-inherited
# from tide's [workspace.package]/[workspace.dependencies] on purpose — the host app
# has no workspace inheritance; keep these literals in sync when re-vendoring.
version = "0.4.0-beta.2"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The ONLY crate in the workspace allowed to depend on rig (churn firewall):
# everything above sees engine abstractions, never rig types.
rig-core = "0.42.0"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
] }
futures = "0.3"
async-stream = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
