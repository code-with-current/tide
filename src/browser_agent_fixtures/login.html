<!doctype html>
<html>
<head>
  <title>Sign in</title>
</head>
<body>
  <h1>Sign in</h1>
  <form action="/login" method="post">
    <label>
      <input type="email" aria-label="Email" name="email">
    </label>
    <p class="hint">Use your work account</p>
    <div class="actions">
      <button type="submit">Continue</button>
    </div>
  </form>
</body>
</html>
