[package]
name = "tide-engine"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The ONLY crate in the workspace allowed to depend on rig (churn firewall):
# everything above sees engine abstractions, never rig types.
rig-core = "0.42.0"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
] }
futures = "0.3"
async-stream = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
