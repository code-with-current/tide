[package]
name = "tide-tools"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = "1"
thiserror = "2"
base64 = "0.22"
git2 = { version = "0.21", features = ["https"] }
# Defaults kept: `default-tls` (rustls in 0.13) powers the git_repo REST
# fast path; dropping it would silently strand https:// URLs when this
# crate is built standalone (cargo test -p tide-tools).
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
sha1_smol = "1"
tempfile = "3"
# ~/.tide resolution for the slash_command catalog (mirrors tide-store::paths)
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
