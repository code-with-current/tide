# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
#
# The Windows release artifact is a zip (win-x64-Tide-Setup.zip) wrapping
# Electrobun's setup bootstrapper at the archive root, so the installer is
# declared as a zip with a nested exe:
#   win-x64-Tide-Setup.zip
#   ├── Tide-Setup.exe            ← nested installer (RelativeFilePath below)
#   └── .installer\*.tar.zst      ← payload the bootstrapper extracts
# The bootstrapper registers an HKCU uninstall entry (identifier
# com.tide.code) and supports --quiet (verified via strings on the 0.3.0-beta.1
# bootstrapper: --bootstrap-install / --quiet / --uninstall --quiet).

PackageIdentifier: Tide.Tide
PackageVersion: @@VERSION_WINGET@@
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: exe
    NestedInstallerFiles:
      - RelativeFilePath: Tide-Setup.exe
    Scope: user
    InstallerUrl: https://github.com/code-with-current/tide/releases/download/v@@VERSION@@/win-x64-Tide-Setup.zip
    InstallerSha256: @@SHA256_WINZIP@@
    InstallerSwitches:
      Silent: --quiet
      SilentWithProgress: --quiet
    ProductCode: com.tide.code
    AppsAndFeaturesEntries:
      - DisplayName: Tide
        Publisher: Tide
        DisplayVersion: "@@VERSION@@"
        ProductCode: com.tide.code
ManifestType: installer
ManifestVersion: 1.10.0
