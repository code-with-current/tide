# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json

PackageIdentifier: Tide.Tide
PackageVersion: "@@VERSION_WINGET@@"
InstallerType: nullsoft
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    # electron-builder NSIS default is a per-user install (no perMachine flag),
    # so Scope is user. The uninstall registry key is the appId.
    Scope: user
    InstallerUrl: https://github.com/code-with-current/tide/releases/download/v@@VERSION@@/Tide-v@@VERSION@@-x64-Setup.exe
    InstallerSha256: "@@SHA256_EXE@@"
    Silent: /S
    SilentWithProgress: /S
    ProductCode: com.tide.code
AppsAndFeaturesEntries:
  - DisplayName: Tide
    Publisher: Tide
    DisplayVersion: "@@VERSION@@"
    ProductCode: com.tide.code
    InstallerType: nullsoft
ManifestType: installer
ManifestVersion: 1.6.0
