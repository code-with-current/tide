[package]
name = "tide"
version = "0.1.15"
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/engine",
    "crates/store",
    "crates/tools",
    "crates/client",
    "crates/backend",
    "crates/protocol",
    "crates/rag",
]
default-members = [
    ".",
    "crates/engine",
    "crates/store",
    "crates/tools",
    "crates/client",
    "crates/backend",
    "crates/protocol",
    "crates/rag",
]
resolver = "2"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
    "wayland",
    "x11",
] }
parking_lot = "0.12"
rquickjs = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
client = { path = "crates/client" }
backend = { path = "crates/backend" }
protocol = { path = "crates/protocol" }
# The commit bar's trailer preview mirrors the daemon's attribution decision
# from the same config file, so the preview can never disagree with the
# commit the daemon writes.
store = { path = "crates/store" }
pulldown-cmark = "0.13"
# The Remote Control dialog renders the connect link as a scannable QR grid;
# default features stay off so no image/svg codecs ride along.
qrcode = { version = "0.14", default-features = false }
regex = "1"
# Remote Control relay client (outbound WSS; native-tls uses the system trust store)
tungstenite = { version = "0.30", features = ["handshake", "native-tls"] }
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "test-support",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", features = ["devtools"] }
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
# The hosted mermaid renderer fetch; gpui's http client slot is only
# installed in Zed-shaped hosts, so the fetch rides reqwest directly. The
# blocking client carries its own runtime — the async one panics outside a
# Tokio context this app never installs.
reqwest = { version = "0.13", features = ["blocking"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "libc",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Matches the version GPUI exposes through `WindowOptions::icon`.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# The browser surface. WebView2 is evergreen on Windows 10 and in-box on 11.
# Tide drives it through `webview2-com` rather than wry because it needs the
# *composition* controller, which renders into a DirectComposition visual
# instead of a child HWND — see `browser::host` for why, and note that only
# the environment can create one, so it cannot be reached from wry's
# `WebViewExtWindows` after the fact.
webview2-com = "0.38"
# Same version GPUI is built against, so the portal's `IDCompositionVisual`
# hands straight to `SetRootVisualTarget` with no ABI bridging. `windows-sys`
# stays for the plain Win32 calls that do not need COM.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# GPUI does not read the Windows animation preference, so Tide asks
# `SystemParametersInfoW` itself. Same major version as the one already in the
# graph through GPUI.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Verifies the EdDSA signatures `generate_appcast` writes, so the Windows
# updater trusts the same key Sparkle does on macOS.
ed25519-dalek = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
