# Release — cuts Tauri installers via tauri-action.
#
# How to cut a release:
#   1. Bump `version` in src-tauri/Cargo.toml ([workspace.package]) and sync
#      tauri.conf.json (node build/sync-version.mjs — the `preapp:build` hook
#      does this on `bun run app:build`).
#   2. git tag v0.4.0 && git push origin v0.4.0
#
# M0 scope — artifacts only: no publishing beyond the draft release, no
# signing, no updater keys (those land with M5). Until then:
#   - v* tag push    → each matrix leg attaches its installers to ONE draft
#     GitHub Release (tauri-action finds-or-creates it). Drafts never
#     disturb the `latest` channel current Electron users poll — publish
#     manually from the draft once the installers are verified.
#   - workflow_dispatch → build + upload workflow artifacts only (no release
#     is created; tauri-action skips release creation when tagName is empty).
#
# Matrix = five installers across four legs:
#   macos universal dmg · windows x64 · windows arm64 · ubuntu AppImage+deb.
# tauri-action runs `tauri build` with beforeBuildCommand (bun run build →
# prompt bundles → tsc -b → vite) so the frontend is built from the same
# checkout, no separate renderer job needed.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # tauri-action creates the draft GitHub Release on tags.

jobs:
  build:
    name: build · ${{ matrix.os }} ${{ matrix.rust_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust_target: universal-apple-darwin
          - os: windows-latest
            args: ''
            rust_target: ''
          - os: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            rust_target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            args: ''
            rust_target: ''

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Add Rust cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      # WebKitGTK 4.1 + GTK3 + Ayatana AppIndicator + librsvg + patchelf
      # (AppImage) — the libs the Tauri linux webview links against on
      # 22.04's older base.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # tagName is the release gate: tauri-action only creates/attaches to a
      # GitHub Release when it is non-empty, so dispatch runs build without
      # touching Releases at all. Draft (+ prerelease: false) keeps the tag's
      # installers invisible until a human publishes.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Tide ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Dispatch runs have no release to attach to — surface the bundles as
      # workflow artifacts instead. Covers both --target layouts
      # (target/<triple>/release/bundle) and the host default
      # (target/release/bundle).
      - name: Upload installers (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.rust_target || 'host' }}
          path: src-tauri/target/**/bundle/**
          if-no-files-found: error
          retention-days: 7
