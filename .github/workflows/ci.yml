# CI — runs on every push to master and every PR.
#
# Why this exists: green main is a P0. Before this workflow the only CI was
# release.yml, which fires on v* tags — so a broken main could sit for
# days and only surface at release time. This gates the default branch on the
# cheap, fast checks so a red main is visible immediately, not at the next
# release.
#
# Two jobs:
#   verify — renderer: bun install → prompt bundles → tsc -b → oxlint → vitest.
#   rust   — src-tauri workspace: cargo test + clippy -D warnings on the Linux
#            webkit deps the workspace links against.
#
# Toolchain intentionally mirrors release.yml (bun + stable Rust) so a push
# build and a release build can never disagree about the environment.
# setup-bun caches ~/.bun keyed on bun.lock automatically; Swatinem/rust-cache
# keys on src-tauri/Cargo.lock.
#
# `node build/promptMarkdownUtils.mjs` is not optional: it generates the
# gitignored src/lib/prompts/_*-bundle.ts files that `tsc -b` resolves —
# without them the typecheck can't even load the prompts project.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      # Generates src/lib/prompts/_*-bundle.ts from the markdown sources —
      # these are gitignored and only exist after this step, but tsc -b
      # resolves them (and src/lib/prompts/tide-system-prompt.ts imports
      # their types).
      - name: Generate prompt bundles
        run: node build/promptMarkdownUtils.mjs

      - name: Lint
        run: bun run lint

      # Type gate: tsc -b covers the renderer + node projects via tsconfig
      # references. A red build here means main doesn't compile.
      - name: Typecheck
        run: bunx tsc -b

      - name: Test
        run: bun run test

  rust:
    name: cargo · test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install linux webkit deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: cargo test --workspace
        working-directory: src-tauri

      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri
