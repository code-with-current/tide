# Publish package-manager manifests (winget / homebrew) after each Release.
#
# Triggered when the Release workflow (tag-driven) completes successfully.
# Renders manifests once (packaging/render.mjs — downloads each installer,
# hashes it), then submits to each package index. Every submission step is
# gated on a secret so the workflow is inert until you configure them.
#
# Snap Store publishing is handled directly in release.yml (electron-builder
# builds + snapcraft pushes in one step). This workflow handles the manifest-
# based package managers only.
#
# One-time setup (see packaging/README.md for detail):
#   winget   — set WINGET_GITHUB_TOKEN (PAT: public_repo + workflow scopes).
#              The workflow creates Tide.Tide on first run (komac new) and
#              bumps it on every subsequent release (komac update).
#   homebrew — set HOMEBREW_GITHUB_API_TOKEN. The workflow pushes the cask
#              directly to code-with-current/homebrew-tap (our own tap).
name: Publish package manifests

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.2-beta)"
        required: true

permissions:
  contents: read

concurrency:
  group: pkg-manifests-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  render:
    # Only act when the Release workflow that woke us up actually succeeded
    # (skipped for manual workflow_dispatch runs).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: render · manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      winget_version: ${{ steps.meta.outputs.winget_version }}
      release_url: ${{ steps.meta.outputs.release_url }}
      exe_url: ${{ steps.meta.outputs.exe_url }}
      exe_sha: ${{ steps.meta.outputs.exe_sha }}
      deb_url: ${{ steps.meta.outputs.deb_url }}
      deb_sha: ${{ steps.meta.outputs.deb_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version from release tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            REF="${{ github.event.workflow_run.head_branch }}"
            TAG="${REF#refs/tags/}"   # defensive: head_branch is the bare tag
          fi
          TAG="${TAG#v}"   # strip leading 'v'
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Downloads every installer from the GitHub Release once and streams each
      # through sha256, then writes the rendered manifests + meta.json.
      - name: Render manifests
        run: |
          node packaging/render.mjs \
            --version "${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Expose manifest values to downstream jobs
        id: meta
        run: |
          M=packaging/out/meta.json
          echo "version=$(jq -r .version "$M")" >> "$GITHUB_OUTPUT"
          echo "winget_version=$(jq -r .wingetVersion "$M")" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "exe_url=$(jq -r .assets.exe.url "$M")" >> "$GITHUB_OUTPUT"
          echo "exe_sha=$(jq -r .assets.exe.sha256 "$M")" >> "$GITHUB_OUTPUT"
          echo "deb_url=$(jq -r .assets.deb.url "$M")" >> "$GITHUB_OUTPUT"
          echo "deb_sha=$(jq -r .assets.deb.sha256 "$M")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: packaging/out/
          retention-days: 7

  winget:
    # Creates Tide.Tide on first run (komac new), then bumps it on every
    # subsequent release (komac update). Both auto-submit a PR to
    # microsoft/winget-pkgs. Requires WINGET_GITHUB_TOKEN.
    name: publish · winget
    needs: render
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
    steps:
      - name: Skip — no WINGET_GITHUB_TOKEN configured
        if: ${{ env.GITHUB_TOKEN == '' }}
        run: echo "::notice::Set the WINGET_GITHUB_TOKEN secret (PAT scopes public_repo + workflow) to enable winget submission."
      - name: Install Komac
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: |
          curl -sL -o /tmp/komac.deb https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac_2.16.0-1_amd64.deb
          sudo dpkg -i /tmp/komac.deb

      - name: Update existing manifest (or create on first release)
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: |
          komac update Tide.Tide \
            --version "${{ needs.render.outputs.winget_version }}" \
            --urls "${{ needs.render.outputs.exe_url }}" \
            --submit || \
          komac new Tide.Tide \
            --version "${{ needs.render.outputs.winget_version }}" \
            --urls "${{ needs.render.outputs.exe_url }}" \
            --submit

  homebrew:
    # Pushes the rendered cask directly to code-with-current/homebrew-tap.
    # No fork, no PR, no notability requirements — it's our own tap.
    # Users install via: brew install --cask code-with-current/tap/tide
    name: publish · homebrew
    needs: render
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
    steps:
      - name: Skip — no HOMEBREW_GITHUB_API_TOKEN configured
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "::notice::Set the HOMEBREW_GITHUB_API_TOKEN secret (scopes public_repo + workflow) to enable homebrew tap publishing."
      - name: Download rendered manifests
        if: ${{ env.GH_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - name: Push cask to code-with-current/homebrew-tap
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          VERSION="${{ needs.render.outputs.version }}"
          TAP="code-with-current/homebrew-tap"
          # Get the existing file SHA (needed to update; absent on first push).
          EXISTING_SHA=$(gh api "repos/${TAP}/contents/Casks/tide.rb" --jq '.sha // empty' 2>/dev/null || true)
          CONTENT=$(base64 -w0 manifests/homebrew/tide.rb)
          ARGS=(-f message="tide ${VERSION}" -f content="${CONTENT}")
          if [ -n "$EXISTING_SHA" ]; then
            ARGS+=(-f sha="${EXISTING_SHA}")
          fi
          gh api --method PUT "repos/${TAP}/contents/Casks/tide.rb" "${ARGS[@]}" >/dev/null
          echo "::notice::Updated Casks/tide.rb in ${TAP} to ${VERSION}"
