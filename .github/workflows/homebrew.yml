name: homebrew

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Bump casks to the published release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET="tide-v${VERSION}-mac-arm64.dmg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tide.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          SHA="$(sha256sum "$RUNNER_TEMP/tide.dmg" | cut -d' ' -f1)"

          sed -i \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            Casks/tide.rb
          git config user.name "tide-release-bot"
          git config user.email "noreply@tide.codes"
          git add Casks/tide.rb
          git commit -m "chore(brew): bump cask to ${TAG}" || exit 0
          git push

          # Keep the canonical tap (code-with-current/homebrew-tap) in sync.
          # Requires HOMEBREW_TAP_TOKEN (classic PAT, repo scope); skipped
          # until that secret exists.
          if [ -n "${GH_TOKEN}" ]; then
            CUR="$(gh api repos/code-with-current/homebrew-tap/contents/Casks/tide.rb --jq '.sha')"
            gh api -X PUT repos/code-with-current/homebrew-tap/contents/Casks/tide.rb \
              -f message="Bump cask to ${TAG}" \
              -f content="$(base64 -w0 < Casks/tide.rb)" \
              -f sha="${CUR}" --silent
          else
            echo "HOMEBREW_TAP_TOKEN not set; tap cask not bumped."
          fi
